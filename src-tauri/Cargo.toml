[package]
name = "sensorbox-os"
version = "0.1.0"
description = "Open-source desktop app for EE Sensor Box"
authors = ["Sensor Box Contributors"]
edition = "2021"

[lib]
name = "sensorbox_os_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4.6"
tauri-plugin-opener = "2.5.4"
